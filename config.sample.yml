port: 8090 # HTTP port of the API and the app's WebSocket
location: Europe/Paris # required by eria-core (timezone)
# First values only, copied to the database at the first start, then edited by the admin.
# Things never shown to the user (glob on TD id): apps, agents, orchestrator
hide:
  - "urn:eria:app:controler:*"
  - "urn:eria:agent:*"
  - "urn:eria:manager:1"
# Contexts of manager-contexts offered to people (other active ones are shown too, by id)
contexts:
  - id: away
    label: Absent
  - id: guests
    label: Invités
  - id: canicule
    label: Canicule
  - id: holiday
    label: Vacances

# SQLite file for profiles, sessions and screens (env ERIA_UI_SERVER_DATABASE overrides it)
database: eria-ui-server.db
# First admin's PIN, used only while there is no profile (or env ERIA_UI_SERVER_ADMIN_PIN)
# adminPin: "<4 to 8 digits>"
# Signed theme archives: <id>.tar + <id>.tar.sig (env ERIA_UI_SERVER_THEMES overrides it)
themes: themes
# TD id of the eria-manager master, for the admin console
master: urn:eria:manager:1
