port: 8090 # TLS port of the app's WebSocket
location: Europe/Paris # required by eria-core (timezone)
health: 127.0.0.1:8099 # plain HTTP health probe, node only
# auth's tunnel listener and the house id (aud of the tokens)
auth: 10.0.0.5:8443
deployment: eria-maison
# Files, relative to the folder of env ERIA_UI_SERVER_DATA when set
cert: relay.crt # role relais-interieur or relais-exterieur, signed by eria-coordinator tls-sign
certKey: relay-tls.key # made by eria-ui-server csr
roots: roots.pem # eria-coordinator tls-root
keyset: auth-keyset.json # eria-coordinator auth-keyset
themes: themes # signed theme archives: <id>.tar + <id>.tar.sig
# TD id of service-notices, whose notifications go to the apps
notices: urn:eria:service:notices
contexts: urn:eria:manager:context # manager-contexts: its active contexts choose the pages shown
# Inner eria-ui-server only (AUTH-DESIGN §2.3): the house's networks it takes
# connections from — the main LAN and its local IPv6 prefix (ULA), never the
# ISP's — a second check behind the firewall; none: every address, warned.
# The outer one's address is told to the apps, which switch to it when the
# inner one can't be reached (from the VPN). The side comes from the
# certificate's role (relais-interieur or relais-exterieur), never from here.
# insideNets: [192.168.10.0/24, fd00:cafe::/48]
# outerUrl: https://10.20.0.6:8090
