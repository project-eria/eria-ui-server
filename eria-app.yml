# ERIA package description (orchestrator catalog, eria-manager DESIGN §12.3)
name: ui-user
title: Interface maison
description: Tableau de bord pour piloter les services (lumières, volets, modes…), avec profils et écrans personnalisés
kind: service
requires: []

exec:
  args: ["--config-path", "{config}"]
  # Profiles, sessions and screens: kept in the agent's data folder across reinstalls.
  # Stateful app: pin it to one node when deploying.
  # Widget packs (PACKS.md): drop folders in {data}/packs on the node, no release needed.
  env: ["UI_USER_DATABASE={data}/ui-user.db", "UI_USER_PACKS={data}/packs"]
  health: { url: "http://127.0.0.1:{port}/api/health", grace: 20s, interval: 10s }

config: |
  host: 0.0.0.0
  port: 8090
  location: Europe/Paris
  # First admin's PIN (4 to 8 digits), used only while there is no profile: change it afterwards
  adminPin: "<4 to 8 digits>"
  # Things never shown to the user (glob on TD id): apps, agents, orchestrator
  hide:
    - "urn:eria:app:controler:*"
    - "urn:eria:agent:*"
    - "urn:eria:manager:1"
  # Contexts of manager-contexts shown as modes
  modes:
    - id: away
      label: Absent
    - id: guests
      label: Invités
    - id: canicule
      label: Canicule
    - id: holiday
      label: Vacances
