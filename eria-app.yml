# ERIA package description (orchestrator catalog, eria-coordinator DESIGN §12.3)
name: eria-ui-server
title: Serveur UI
description: Relais entre l'application ERIA et les services (lumières, volets, contextes…), et tunnel vers auth
kind: service
requires: []

exec:
  args: ["--config-path", "{config}"]
  # No state of its own (AUTH-DESIGN §3.6). {data} holds its TLS files:
  #   eria-ui-server csr  (TLS key), then eria-coordinator tls-sign --role relais-interieur
  #   roots.pem (eria-coordinator tls-root) and auth-keyset.json (eria-coordinator auth-keyset)
  # Themes: drop signed archives (<id>.tar + .sig) in {data}/themes on the node.
  env: ["ERIA_UI_SERVER_DATA={data}"]
  health: { url: "http://127.0.0.1:8099/api/health", grace: 20s, interval: 10s }

config: |
  host: 0.0.0.0
  port: 8090
  location: Europe/Paris
  # auth's tunnel listener, and the id of the house (the tokens' aud)
  auth: "<auth node>:8443"
  deployment: eria-maison
