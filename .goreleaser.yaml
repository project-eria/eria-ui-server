# GoReleaser config of ui-user: same assets as the shared ERIA config
# (project-eria/workflows), plus the frontend build and the Go module in backend/.
version: 2
project_name: ui-user

before:
  hooks:
    # SvelteKit build, embedded by the Go binary (backend/web)
    - sh -c "cd frontend && pnpm install --frozen-lockfile && pnpm build"
    - sh -c "cd backend && go mod download"

builds:
  - dir: backend
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64 # Raspberry Pi 3 & 4
      - amd64
    ldflags:
      - -X github.com/project-eria/eria-core.AppVersion={{.Version}} -X github.com/project-eria/eria-core.BuildDate={{.Date}}

archives:
  # Raw binaries downloaded by the ERIA orchestrator (catalog, DESIGN §12.2)
  - id: raw
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

release:
  extra_files:
    - glob: ./eria-app.yml

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./eria-app.yml

snapshot:
  version_template: "{{ .Version }}-dev-{{ .ShortCommit }}"
